[pytest]
; Los tests de la tubería son `async def` (colas, streaming, TTS). Con
; `asyncio_mode = auto`, pytest los ejecuta sin necesidad de poner
; @pytest.mark.asyncio en cada uno: menos ruido y menos olvidos.
asyncio_mode = auto

; Cada test async estrena su propio bucle de eventos. Es lo que se quiere aquí:
; cada test simula un turno independiente, sin estado compartido entre ellos.
asyncio_default_fixture_loop_scope = function

testpaths = tests
